<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Clicker</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --text-color: #e94560;
            --button-bg: #16213e;
            --button-hover: #0f3460;
            --highlight: #533483;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        #header {
            text-align: center;
            margin-top: 20px;
            z-index: 10;
        }

        #score-display {
            font-size: 4rem;
            font-weight: bold;
            color: var(--text-color);
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        #cps-display {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 20px;
        }

        #main-button {
            background-color: var(--text-color);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 2rem;
            font-family: inherit;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 #a31d35;
            transition: transform 0.1s, box-shadow 0.1s;
            outline: none;
            margin-bottom: 30px;
            z-index: 10;
        }

        #main-button:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #a31d35;
        }

        #shop-container {
            width: 100%;
            max-width: 600px;
            flex: 1;
            overflow-y: auto;
            border-top: 2px solid var(--highlight);
            background: rgba(0,0,0,0.2);
            padding: 10px;
        }

        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--button-bg);
            border: 1px solid var(--highlight);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            opacity: 0.7;
        }

        .upgrade-item.affordable {
            opacity: 1;
            background-color: var(--highlight);
        }

        .upgrade-item.affordable:hover {
            background-color: var(--button-hover);
        }

        .upgrade-info h3 { margin: 0 0 5px 0; font-size: 1.1rem; }
        .upgrade-info p { margin: 0; font-size: 0.8rem; color: #aaa; }
        .upgrade-cost { font-weight: bold; color: var(--text-color); }
        .upgrade-count { font-size: 1.5rem; margin-left: 15px; color: #fff; }

        /* Floating text animation */
        .click-text {
            position: absolute;
            color: white;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }
    </style>
</head>
<body>

    <div id="header">
        <div id="score-display">0</div>
        <div id="cps-display">0 per second</div>
        <button id="main-button">PRESS SPACE</button>
    </div>

    <div id="shop-container">
        </div>

    <script>
        // Game State
        const state = {
            score: 0,
            clickPower: 1, // Points per click
            autoPointsPerSecond: 0,
            lastTick: Date.now()
        };

        // Configuration for Upgrades
        // You can add as many new items here as you want
        const upgrades = [
            { id: 1, name: "Auto-Clicker", desc: "Clicks once every second.", baseCost: 15, basePower: 0.5, count: 0 },
            { id: 2, name: "Grandma", desc: "Bakes cookies... wait, wrong game.", baseCost: 100, basePower: 2, count: 0 },
            { id: 3, name: "Keyboard Macro", desc: "Automated typing scripts.", baseCost: 500, basePower: 8, count: 0 },
            { id: 4, name: "AI Bot", desc: "Uses machine learning to click.", baseCost: 2000, basePower: 25, count: 0 },
            { id: 5, name: "Quantum Computer", desc: "Clicks in multiple dimensions.", baseCost: 10000, basePower: 100, count: 0 }
        ];

        // DOM Elements
        const scoreEl = document.getElementById('score-display');
        const cpsEl = document.getElementById('cps-display');
        const btn = document.getElementById('main-button');
        const shopEl = document.getElementById('shop-container');

        // Initialize Shop
        function initShop() {
            shopEl.innerHTML = '';
            upgrades.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'upgrade-item';
                div.id = `upgrade-${index}`;
                div.onclick = () => buyUpgrade(index);
                
                div.innerHTML = `
                    <div class="upgrade-info">
                        <h3>${item.name}</h3>
                        <p>${item.desc} (+${item.basePower}/sec)</p>
                        <div class="upgrade-cost">Cost: ${formatNumber(item.baseCost)}</div>
                    </div>
                    <div class="upgrade-count" id="count-${index}">0</div>
                `;
                shopEl.appendChild(div);
            });
        }

        // Core Mechanics
        function clickAction(e) {
            addScore(state.clickPower);
            
            // Visual Effect
            if(e) {
                createFloatingText(e.clientX, e.clientY, `+${state.clickPower}`);
            } else {
                // If triggered by spacebar, center effect
                const rect = btn.getBoundingClientRect();
                createFloatingText(rect.left + rect.width/2, rect.top, `+${state.clickPower}`);
            }
            
            // Button Animation
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => btn.style.transform = 'scale(1)', 50);
        }

        function addScore(amount) {
            state.score += amount;
            updateDisplay();
        }

        function buyUpgrade(index) {
            const item = upgrades[index];
            const currentCost = Math.floor(item.baseCost * Math.pow(1.15, item.count));

            if (state.score >= currentCost) {
                state.score -= currentCost;
                item.count++;
                state.autoPointsPerSecond += item.basePower;
                
                // Update UI for this item
                const countEl = document.getElementById(`count-${index}`);
                if(countEl) countEl.innerText = item.count;
                
                // Recalculate and update cost display
                const nextCost = Math.floor(item.baseCost * Math.pow(1.15, item.count));
                const itemEl = document.getElementById(`upgrade-${index}`);
                itemEl.querySelector('.upgrade-cost').innerText = `Cost: ${formatNumber(nextCost)}`;
                
                updateDisplay();
            }
        }

        // Game Loop
        function gameLoop() {
            const now = Date.now();
            const dt = (now - state.lastTick) / 1000; // Delta time in seconds
            state.lastTick = now;

            if (state.autoPointsPerSecond > 0) {
                addScore(state.autoPointsPerSecond * dt);
            }
            
            checkAffordability();
            requestAnimationFrame(gameLoop);
        }

        // Helpers
        function updateDisplay() {
            scoreEl.innerText = formatNumber(Math.floor(state.score));
            cpsEl.innerText = `${formatNumber(state.autoPointsPerSecond.toFixed(1))} per second`;
        }

        function checkAffordability() {
            upgrades.forEach((item, index) => {
                const currentCost = Math.floor(item.baseCost * Math.pow(1.15, item.count));
                const el = document.getElementById(`upgrade-${index}`);
                if (state.score >= currentCost) {
                    el.classList.add('affordable');
                } else {
                    el.classList.remove('affordable');
                }
            });
        }

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function createFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'click-text';
            el.innerText = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        // Event Listeners
        btn.addEventListener('mousedown', clickAction);
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // Prevent scrolling
                if (!e.repeat) clickAction(); // Prevent holding key down
                btn.style.transform = 'translateY(5px)';
                btn.style.boxShadow = '0 0 0 #a31d35';
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                btn.style.transform = 'translateY(0)';
                btn.style.boxShadow = '0 5px 0 #a31d35';
            }
        });

        // Initialize
        initShop();
        gameLoop();

    </script>
</body>
</html>
